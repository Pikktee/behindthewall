<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Behind The Wall</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div>
          <p class="eyebrow">Behind The Wall</p>
          <h1 id="page-title">Seite speichern</h1>
        </div>
        <button
          type="button"
          class="icon-button"
          data-action="open-settings"
          aria-label="Backend konfigurieren"
          title="Backend konfigurieren"
        >
          <span aria-hidden="true">&#9881;</span>
        </button>
      </header>

      <section class="url-box" aria-label="Aktuelle URL">
        <span id="page-url">...</span>
      </section>

      <section class="actions" aria-label="Archivdienste">
        <button type="button" data-action="save-page">
          <span class="icon" aria-hidden="true">S</span>
          <span>Seite speichern</span>
        </button>
        <button type="button" data-action="open-library">
          <span class="icon" aria-hidden="true">B</span>
          <span>Bibliothek oeffnen</span>
        </button>
        <button type="button" data-action="archive-is-view">
          <span class="icon" aria-hidden="true">A</span>
          <span>Archive.is anzeigen</span>
        </button>
        <button type="button" data-action="wayback-view">
          <span class="icon" aria-hidden="true">W</span>
          <span>Wayback anzeigen</span>
        </button>
      </section>

      <p id="popup-status" class="status-line" aria-live="polite"></p>
      <p class="note">
        Beim Speichern werden Titel, Beschreibung und extrahierter Seiteninhalt ans Backend geschickt.
      </p>
    </main>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
