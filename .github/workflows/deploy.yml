name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          BTW_API_TOKEN: ${{ secrets.BTW_API_TOKEN }}
          BTW_DB_PATH: ${{ secrets.BTW_DB_PATH }}
          BTW_DATA_DIR: ${{ secrets.BTW_DATA_DIR }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; \
             export APP_DIR=$(printf '%q' "$DEPLOY_PATH"); \
             export DEPLOY_BRANCH=$(printf '%q' "$DEPLOY_BRANCH"); \
             export BTW_API_TOKEN=$(printf '%q' "$BTW_API_TOKEN"); \
             export BTW_DB_PATH=$(printf '%q' "$BTW_DB_PATH"); \
             export BTW_DATA_DIR=$(printf '%q' "$BTW_DATA_DIR"); \
             cd $(printf '%q' "$DEPLOY_PATH"); \
             if [ -d .git ]; then \
               git fetch origin $(printf '%q' "$DEPLOY_BRANCH"); \
               git checkout $(printf '%q' "$DEPLOY_BRANCH"); \
               git reset --hard origin/$(printf '%q' "$DEPLOY_BRANCH"); \
             fi; \
             mkdir -p \"\${BTW_DATA_DIR:-\$HOME/var/lib/behind-the-wall}\"; \
             export BTW_DB_PATH=\"\${BTW_DB_PATH:-\${BTW_DATA_DIR:-\$HOME/var/lib/behind-the-wall}/bookmarks.sqlite}\"; \
             npm install --omit=dev; \
             if npx pm2 describe behind-the-wall >/dev/null 2>&1; then \
               npx pm2 restart behind-the-wall --update-env; \
             else \
               npx pm2 start ecosystem.config.cjs --update-env; \
             fi; \
             npx pm2 save"
